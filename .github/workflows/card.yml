name: neofetch card
on:
  schedule: [{ cron: "7 * * * *" }]   # hourly, keeps "today" fresh
  workflow_dispatch:
  push: { branches: [main], paths: ["scripts/**", "assets/ascii.txt"] }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/build_card.mjs
        env:
          # optional: add a PAT as repo secret GH_STATS_TOKEN to include private contributions
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/card.svg
          git diff --cached --quiet || (git commit -m "chore: refresh card" && git push)
